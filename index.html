<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="color.css">
</head>

<body>

    <div class="weather-card">

        <div class="search-box d-flex align-items-center gap-3">

            <input
                type="text"
                class="form-control"
                placeholder="Enter city name">

            <button class="search-btn flex-shrink-0">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

        </div>

        <div class="detail">

            <div class="weather-icon">
                <i class="fa-solid fa-cloud-sun-rain"></i>
            </div>

            <h1 class="temperature text-center">
                22°C
            </h1>

            <h2 class="city text-center">
                New Delhi
            </h2>

            <div class="weather-info row g-3">

                <div class="col-6">

                    <div class="info-box d-flex align-items-center gap-3">

                        <i class="fa-solid fa-water"></i>

                        <div>
                            <p class="humidity">50%</p>
                            <span>Humidity</span>
                        </div>

                    </div>

                </div>

                <div class="col-6">

                    <div class="info-box d-flex align-items-center gap-3">

                        <i class="fa-solid fa-wind"></i>

                        <div>
                            <p class="wind">15 km/h</p>
                            <span>Wind Speed</span>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="index.js"></script>

</body>

</html>
